    path: /api/v1/cases/{case_id}/log-triage/{triage_run_id}
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  list_log_triage_evidence:
    method: GET
    path: /api/v1/cases/{case_id}/log-triage/{triage_run_id}/evidence
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  list_log_triage_match_occurrences:
