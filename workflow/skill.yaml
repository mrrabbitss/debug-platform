name: gw-ap-debug-assistant
version: 0.9.0
policy_revision: expert-model-knowledge-20260909
description: Upload and diagnose GW/AP collectDebuginfo, and route Markdown knowledge through the internal Debug Platform API.
mcp:
  status: IN_PROGRESS
  contract: mcp-tools.yaml
  contract_version: 0.3.0
  transport: streamable_http
  path: /mcp
  authentication: Bearer
  reasoning_owner: host_cli
  backend_generative_llm_calls: forbidden
entrypoints:
  discover_client_server:
    method: GET
    path: /api/v1/system/client-info
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  list_knowledge_publications:
    method: GET
    path: /api/v1/knowledge/{document_id}/publications
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  read_knowledge_revision_evidence:
    method: GET
    path: /api/v1/knowledge/{document_id}/versions/{version}/chunks/{chunk_id}
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  create_case:
    method: POST
    path: /api/v1/cases
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
    request_body:
      type: object
      properties:
        problem_category: { type: string, maxLength: 80, default: unknown }
        chat_profile_id: { type: [string, 'null'], maxLength: 40, default: null }
        model_egress_approved: { type: boolean, default: true }
  upload_debug_info:
    method: POST
    path: /api/v1/cases/{case_id}/artifacts
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
  upload_knowledge:
    method: POST
    path: /api/v1/knowledge/upload
    allowed_roles: [ADMIN, EXPERT]
  route_markdown_knowledge:
    method: POST
    path: /api/v1/knowledge-routing/import
    allowed_roles: [ADMIN, EXPERT]
  upload_repository:
    method: POST
    path: /api/v1/cases/{case_id}/repositories
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
  get_job:
    method: GET
    path: /api/v1/jobs/{job_id}
    allowed_roles: [ADMIN, EXPERT, ENGINEER, VIEWER]
  index_repository:
    method: POST
    path: /api/v1/repositories/{repository_id}/index
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
  agentic_search:
    method: POST
    path: /api/v1/cases/{case_id}/agentic-search
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
  parse:
    method: POST
    path: /api/v1/cases/{case_id}/artifacts/{artifact_id}/parse
    allowed_roles: [ADMIN, EXPERT, ENGINEER]
  plan_log_triage:
