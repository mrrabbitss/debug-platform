      additionalProperties: false
      type: object
      required:
      - version
      - model_egress_approved
      title: ConsentInput
    ConversationInput:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        message:
          type: string
          maxLength: 12000
          minLength: 1
          pattern: \S
          title: Message
        mode:
          anyOf:
          - type: string
            enum:
            - auto
            - answer
            - edit
          - type: 'null'
          title: Mode
        model_egress_approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Model Egress Approved
      additionalProperties: false
      type: object
      required:
      - version
      - message
      title: ConversationInput
    HTTPValidationError:
      properties:
