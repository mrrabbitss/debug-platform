openapi: 3.1.0
info:
  title: GW/AP Debug Platform Workflow API
  version: 0.9.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /system/client-info:
    get:
      operationId: discoverClientServer
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      responses:
        '200': { description: Authenticated server identity and client compatibility contract }
  /knowledge/{document_id}/publications:
    get:
      operationId: listKnowledgePublications
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Immutable publication manifests }
  /knowledge/{document_id}/versions/{version}/chunks/{chunk_id}:
    get:
      operationId: readKnowledgeRevisionEvidence
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string }
        - in: path
          name: version
          required: true
          schema: { type: integer }
        - in: path
          name: chunk_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Committed immutable evidence with current-version indicator }
        '404': { description: Evidence missing or belongs to an uncommitted preparation }
  /cases:
    post:
      operationId: createDebugCase
      x-allowed-roles: [ADMIN, ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                device_type: { type: string, enum: [GW, AP, OTHER], default: GW }
                description: { type: string }
                device_model: { type: string }
                firmware_version: { type: string }
                problem_category: { type: string, maxLength: 80, default: unknown }
                chat_profile_id: { type: [string, 'null'], maxLength: 40, default: null }
                model_egress_approved: { type: boolean, default: true, description: New-case consent only; explicit false is preserved and endpoint policy still applies. }
      responses:
        '200': { description: Created }
  /cases/{case_id}/artifacts:
    post:
      operationId: uploadDebugArtifact
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, default: debug_log }
                source_device_type: { type: string, enum: [GW, AP, UNKNOWN], default: UNKNOWN }
                source_device_role: { type: string, enum: [PRIMARY, SECONDARY, UNKNOWN], default: UNKNOWN }
      responses:
        '200': { description: Artifact stored locally }
  /cases/{case_id}/artifacts/{artifact_id}/parse:
    post:
      operationId: parseDebugArtifact
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Parse job accepted }
  /cases/{case_id}/analyses:
    post:
      operationId: startDiagnosis
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Analysis job }
  /cases/{case_id}/artifacts/{artifact_id}/triage:
    post:
      operationId: planLogTriage
      x-allowed-roles: [ADMIN, ENGINEER]
      description: Starts background LLM planning followed by local three-bucket log scanning.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '202': { description: Log triage and trace job accepted }
        '409': { description: Parse or model-egress approval prerequisite is missing }
  /cases/{case_id}/log-triage/{triage_run_id}:
    get:
      operationId: getLogTriage
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: triage_run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Method coverage, validated plan and bucket summary }
  /cases/{case_id}/log-triage/{triage_run_id}/evidence:
    get:
      operationId: listLogTriageEvidence
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: triage_run_id
          required: true
          schema: { type: string }
        - in: query
          name: bucket
          required: true
          schema:
            type: string
            enum: [LLM_RELEVANT, METHOD_REQUIRED, OTHER]
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Ranked and paginated log evidence }
  /cases/{case_id}/log-triage/{triage_run_id}/evidence/{match_id}/occurrences:
    get:
      operationId: listLogTriageMatchOccurrences
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: triage_run_id
          required: true
          schema: { type: string }
        - in: path
          name: match_id
          required: true
          schema: { type: string }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Every exact source location for one grouped triage match }
        '404': { description: Case, triage run or grouped match was not found }
  /cases/{case_id}/chat:
    post:
      operationId: askAboutCase
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                intent: { type: string, enum: [ANSWER, REVISE_DIAGNOSIS], default: ANSWER }
                source_analysis_id: { type: string }
      responses:
        '202': { description: Recoverable background chat job accepted }
  /cases/{case_id}/conversations:
    get:
      operationId: listCaseConversation
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Persisted queued, running, completed or failed messages }
  /cases/{case_id}/analysis-revisions:
    get:
      operationId: listAnalysisRevisions
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Diagnosis/report revision drafts and review states }
  /cases/{case_id}/analysis-revisions/{revision_id}:
    get:
      operationId: getAnalysisRevision
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: revision_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Evidence-validated revision draft }
  /cases/{case_id}/analysis-revisions/{revision_id}/apply:
    post:
      operationId: applyAnalysisRevision
      x-allowed-roles: [ADMIN, ENGINEER]
      description: Human approval creates a new immutable analysis and report source.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: revision_id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200': { description: New approved diagnosis version }
        '409': { description: Draft state or source-version conflict }
  /cases/{case_id}/analysis-revisions/{revision_id}/reject:
    post:
      operationId: rejectAnalysisRevision
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: revision_id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200': { description: Revision draft rejected without changing diagnosis }
  /cases/{case_id}/agent-runs/{run_id}:
    get:
      operationId: getCaseAgentRun
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      description: Returns a case-scoped redacted planning trace for authorized case members.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ordered redacted planning trace }
        '404': { description: Run not found in this case }
  /cases/{case_id}/analyses/{analysis_id}/report/preview:
    get:
      operationId: previewDiagnosisReport
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: analysis_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Evidence-grounded HTML report preview
          content:
            text/html:
              schema: { type: string }
  /knowledge/upload:
    post:
      operationId: uploadKnowledgeDocument
      x-allowed-roles: [ADMIN]
      description: Saves the upload and returns a background import job.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source_type: { type: string, default: document }
                device_type: { type: string }
                module: { type: string }
                trust_level: { type: string, default: MEDIUM }
                category_id: { type: string }
      responses:
        '202': { description: Knowledge import job accepted }
  /knowledge-routing/import:
    post:
      operationId: importMarkdownForRouting
      x-allowed-roles: [ADMIN]
      description: >-
        Accepts one or more Markdown files and creates one independent inactive
        knowledge DRAFT per file. Web requests use a selected or active platform
        Chat profile; host_cli requests stage drafts for classification by the
        current Claude Code or Codex model. This operation never publishes knowledge.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: binary }
                relative_paths_json:
                  type: string
                  default: '[]'
                reasoning_owner:
                  type: string
                  enum: [platform_llm, host_cli]
                  default: platform_llm
                model_profile_id: { type: string }
                consent_model_egress: { type: boolean, default: false }
                trust_level:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                  default: MEDIUM
                confidentiality:
                  type: string
                  enum: [PUBLIC, INTERNAL, RESTRICTED]
                  default: INTERNAL
      responses:
        '202': { description: One persistent routing job per Markdown file was accepted; all outputs remain DRAFT }
        '400': { description: Invalid file count, extension, relative path or metadata }
        '403': { description: Administrator role required }
        '409': { description: Model profile or model-egress consent is unavailable }
  /cases/{case_id}/repositories:
    post:
      operationId: uploadSourceRepository
      x-allowed-roles: [ADMIN, ENGINEER]
      description: Saves ZIP/TAR/Git Bundle input and imports it in a background job.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202': { description: Repository import job accepted }
  /repositories/{repository_id}/index:
    post:
      operationId: indexSourceRepository
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: repository_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Atomic code and commit graph indexing job }
        '409': { description: Repository import has not completed }
  /jobs/{job_id}:
    get:
      operationId: getBackgroundJob
      x-allowed-roles: [ADMIN, ENGINEER, VIEWER]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job status, progress and result }
  /cases/{case_id}/agentic-search:
    post:
      operationId: runAgenticSearch
      x-allowed-roles: [ADMIN, ENGINEER]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                top_k: { type: integer, minimum: 1, maximum: 50, default: 12 }
                max_hops: { type: integer, minimum: 0, maximum: 3, default: 2 }
                modules:
                  type: array
                  items: { type: string, enum: [knowledge, code, commit, memory] }
      responses:
        '200': { description: Planned multi-module retrieval result }
  /knowledge-curations:
    get:
      operationId: listKnowledgeCurations
      x-allowed-roles: [ADMIN]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Knowledge curation sessions }
    post:
      operationId: createKnowledgeCuration
      x-allowed-roles: [ADMIN]
      description: >-
        Stores source files locally and starts an evidence-gated background
        extraction. API model egress requires explicit consent.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                relative_paths_json: { type: string, default: '[]' }
                title_hint: { type: string, maxLength: 512 }
                category_id: { type: string }
                device_type: { type: string }
                device_model: { type: string }
                firmware_range: { type: string }
                module: { type: string }
                trust_level: { type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM }
                confidentiality:
                  type: string
                  enum: [PUBLIC, INTERNAL, RESTRICTED]
                  default: RESTRICTED
                model_profile_id: { type: string }
                consent_model_egress: { type: boolean, default: false }
      responses:
        '202': { description: Curation session and background job accepted }
        '409': { description: Model egress consent is required }
  /knowledge-curations/{session_id}:
    get:
      operationId: getKnowledgeCuration
      x-allowed-roles: [ADMIN]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session, sources, revisions and conversation }
  /knowledge-curations/{session_id}/chat:
    post:
      operationId: refineKnowledgeCuration
      x-allowed-roles: [ADMIN]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction, expected_draft_version]
              properties:
                instruction: { type: string, minLength: 1, maxLength: 20000 }
                expected_draft_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: New immutable draft revision }
        '409': { description: Draft version conflict }
  /knowledge-curations/{session_id}/confirm:
    post:
      operationId: confirmKnowledgeCurationDraft
      x-allowed-roles: [ADMIN]
      description: Creates an inactive DRAFT document; it does not publish knowledge.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_draft_version]
              properties:
                expected_draft_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Inactive DRAFT knowledge document created }
        '409': { description: Draft version conflict or already confirmed }
  /agent-runs:
    get:
      operationId: listAgentRuns
      x-allowed-roles: [ADMIN]
      description: Lists redacted execution metadata; raw uploaded content is never returned.
      parameters:
        - in: query
          name: case_id
          schema: { type: string }
        - in: query
          name: resource_id
          schema: { type: string }
        - in: query
          name: operation
          schema: { type: string, maxLength: 64 }
        - in: query
          name: status
          schema: { type: string, maxLength: 32 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Redacted agent run summaries }
  /agent-runs/{run_id}:
    get:
      operationId: getAgentRun
      x-allowed-roles: [ADMIN]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Redacted run metadata and ordered trace events }
        '404': { description: Run not found }
  /agent-runs/{run_id}/replay:
    post:
      operationId: replayAgentRun
      x-allowed-roles: [ADMIN]
      description: >-
        Replays an eligible search from a redacted payload in read-only mode;
        memory writes and knowledge publication remain disabled.
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: New traceable read-only search result }
        '409': { description: The run has no safe replay payload }
  /workbench/bootstrap:
    get:
      tags:
      - workbench
      summary: Bootstrap
      operationId: bootstrap_api_v1_workbench_bootstrap_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      - ENGINEER
      - VIEWER
      x-agent-callable: true
  /workbench/preferences:
    put:
      tags:
      - workbench
      summary: Preferences
      operationId: preferences_api_v1_workbench_preferences_put
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      - ENGINEER
      x-agent-callable: true
      description: Select an enabled administrator-preset chat model for the current user only. Does not activate
        or modify global profiles.
  /workbench/templates/{category_id}:
    put:
      tags:
      - workbench
      summary: Choose Template
      operationId: choose_template_api_v1_workbench_templates__category_id__put
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          title: Category Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateChoice'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      x-agent-callable: false
      description: Administrator-only REST operation; not part of the agent or MCP write allowlist.
  /workbench/categories:
    post:
      tags:
      - workbench
      summary: Add Category
      operationId: add_category_api_v1_workbench_categories_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      x-agent-callable: false
      description: Administrator-only REST operation; not part of the agent or MCP write allowlist.
  /workbench/knowledge:
    get:
      tags:
      - workbench
      summary: Knowledge
      operationId: knowledge_api_v1_workbench_knowledge_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      - ENGINEER
      - VIEWER
      x-agent-callable: true
  /workbench/library:
    post:
      tags:
      - workbench
      summary: Submit Library
      operationId: submit_library_api_v1_workbench_library_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibrarySubmission'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Role or resource scope does not authorize this operation
      x-allowed-roles:
      - ADMIN
      - ENGINEER
      x-agent-callable: true
      description: Submit PENDING case knowledge. A supplied case must exist and be owned by the engineer (or submitted
        by ADMIN); a report requires a matching COMPLETED analysis and is rendered on the server. Only an administrator
        can confirm sharing.
    get:
      tags:
      - workbench
      summary: Library
      operationId: library_api_v1_workbench_library_get
      parameters:
      - name: x-api-key
        in: header
