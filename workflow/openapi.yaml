          title: Files
          default: []
        paths:
          type: string
          maxLength: 34000
          title: Paths
          default: '[]'
        message:
          type: string
          maxLength: 12000
          minLength: 1
          title: Message
          default: 请完整阅读资料，比较已有知识，给出归类和新增、合并或替换方案。
        model_egress_approved:
          type: boolean
          title: Model Egress Approved
          default: true
        mode:
          type: string
          enum:
          - auto
          - answer
          - edit
          title: Mode
          default: auto
      type: object
      title: Body_create_session_api_v1_workbench_assistant_post
    CategoryInput:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: CategoryInput
    Confirmation:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        review_digest:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 64
