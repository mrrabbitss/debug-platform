openapi: 3.1.0
info:
  title: GW/AP Debug Platform Workflow API
  version: 0.3.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /cases:
    post:
      operationId: createDebugCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, device_type]
              properties:
                title: { type: string }
                device_type: { type: string, enum: [GW, AP, OTHER] }
                description: { type: string }
                device_model: { type: string }
                firmware_version: { type: string }
      responses:
        '200': { description: Created }
  /cases/{case_id}/artifacts:
    post:
      operationId: uploadDebugArtifact
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, default: debug_log }
      responses:
        '200': { description: Artifact stored locally }
  /cases/{case_id}/artifacts/{artifact_id}/parse:
    post:
      operationId: parseDebugArtifact
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Parse job accepted }
  /cases/{case_id}/analyses:
    post:
      operationId: startDiagnosis
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Analysis job }
  /cases/{case_id}/chat:
    post:
      operationId: askAboutCase
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        '200': { description: Evidence-grounded answer }
  /cases/{case_id}/analyses/{analysis_id}/report/preview:
    get:
      operationId: previewDiagnosisReport
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
        - in: path
          name: analysis_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Evidence-grounded HTML report preview
          content:
            text/html:
              schema: { type: string }
  /knowledge/upload:
    post:
      operationId: uploadKnowledgeDocument
      description: Saves the upload and returns a background import job.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source_type: { type: string, default: document }
                device_type: { type: string }
                module: { type: string }
                trust_level: { type: string, default: MEDIUM }
                category_id: { type: string }
      responses:
        '202': { description: Knowledge import job accepted }
  /cases/{case_id}/repositories:
    post:
      operationId: uploadSourceRepository
      description: Saves ZIP/TAR/Git Bundle input and imports it in a background job.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202': { description: Repository import job accepted }
  /repositories/{repository_id}/index:
    post:
      operationId: indexSourceRepository
      parameters:
        - in: path
          name: repository_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Atomic code and commit graph indexing job }
        '409': { description: Repository import has not completed }
  /jobs/{job_id}:
    get:
      operationId: getBackgroundJob
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job status, progress and result }
  /cases/{case_id}/agentic-search:
    post:
      operationId: runAgenticSearch
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                top_k: { type: integer, minimum: 1, maximum: 50, default: 12 }
                max_hops: { type: integer, minimum: 0, maximum: 3, default: 2 }
                modules:
                  type: array
                  items: { type: string, enum: [knowledge, code, commit, memory] }
      responses:
        '200': { description: Planned multi-module retrieval result }
  /knowledge-curations:
    get:
      operationId: listKnowledgeCurations
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Knowledge curation sessions }
    post:
      operationId: createKnowledgeCuration
      description: >-
        Stores source files locally and starts an evidence-gated background
        extraction. API model egress requires explicit consent.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                relative_paths_json: { type: string, default: '[]' }
                title_hint: { type: string, maxLength: 512 }
                category_id: { type: string }
                device_type: { type: string }
                device_model: { type: string }
                firmware_range: { type: string }
                module: { type: string }
                trust_level: { type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM }
                confidentiality:
                  type: string
                  enum: [PUBLIC, INTERNAL, RESTRICTED]
                  default: RESTRICTED
                model_profile_id: { type: string }
                consent_model_egress: { type: boolean, default: false }
      responses:
        '202': { description: Curation session and background job accepted }
        '409': { description: Model egress consent is required }
  /knowledge-curations/{session_id}:
    get:
      operationId: getKnowledgeCuration
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session, sources, revisions and conversation }
  /knowledge-curations/{session_id}/chat:
    post:
      operationId: refineKnowledgeCuration
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction, expected_draft_version]
              properties:
                instruction: { type: string, minLength: 1, maxLength: 20000 }
                expected_draft_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: New immutable draft revision }
        '409': { description: Draft version conflict }
  /knowledge-curations/{session_id}/confirm:
    post:
      operationId: confirmKnowledgeCurationDraft
      description: Creates an inactive DRAFT document; it does not publish knowledge.
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_draft_version]
              properties:
                expected_draft_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Inactive DRAFT knowledge document created }
        '409': { description: Draft version conflict or already confirmed }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKey: []
