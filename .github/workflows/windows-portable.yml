name: Windows Portable Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and smoke-test self-contained package
        shell: pwsh
        run: >-
          ./scripts/build_windows_portable.ps1
          -PythonExe python
      - uses: actions/upload-artifact@v7
        with:
          name: debug-platform-windows-x64
          path: |
            artifacts/portable/debug-platform-windows-x64.zip
            artifacts/portable/debug-platform-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: debug-platform-windows-x64
          path: artifacts/portable
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/portable/debug-platform-windows-x64.zip \
            artifacts/portable/debug-platform-windows-x64.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Debug Platform $GITHUB_REF_NAME"
