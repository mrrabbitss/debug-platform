name: Windows Full GGUF Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version (for example 0.2.0)
        required: true
        default: "0.2.0"
        type: string
      hf_endpoint:
        description: Optional HTTPS Hugging Face mirror origin
        required: false
        default: ""
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-full-gguf-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Win11 full-GGUF installer
    runs-on: windows-2022
    timeout-minutes: 150
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.lock
            scripts/model-runtime/model-assets.json

      - name: Select Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve and validate package version
        id: release-version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $rawVersion = if ($env:EVENT_NAME -eq "release") {
            $env:RELEASE_TAG
          } else {
            $env:DISPATCH_VERSION
          }
          if ($rawVersion.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $rawVersion = $rawVersion.Substring(1)
          }
          if ($rawVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Release/package version must have three or four numeric components."
          }
          "version=$rawVersion" >> $env:GITHUB_OUTPUT

      - name: Validate the pinned model supply-chain manifest
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $arguments = @("scripts/model-runtime/validate_assets.py")
          if ($env:EVENT_NAME -eq "release") {
            # A published release is blocked until conversion hashes and both
            # quality gates are explicitly promoted in model-assets.json.
            $arguments += "--strict-release"
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned model manifest validation failed."
          }
          python scripts/model-runtime/prepare_assets.py
          if ($LASTEXITCODE -ne 0) {
            throw "Model preparation plan validation failed."
          }

      - name: Run static GGUF launcher contracts before large downloads
        shell: pwsh
        run: |
          python scripts/test_portable_gguf_launcher.py
          if ($LASTEXITCODE -ne 0) {
            throw "GGUF launcher contract tests failed."
          }

      - name: Restore verified immutable model inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/build-cache/windows-x64/downloads
            artifacts/build-cache/windows-x64/sources
            artifacts/build-cache/windows-x64/models
            artifacts/build-cache/windows-x64/licenses
            artifacts/build-cache/windows-x64/llama
            artifacts/build-cache/windows-x64/build/llama.cpp
          key: full-gguf-win-x64-${{ hashFiles('scripts/model-runtime/model-assets.json', 'scripts/model-runtime/prepare_assets.py', 'scripts/model-runtime/validate_assets.py') }}

      - name: Download, verify and convert pinned GGUF components
        shell: pwsh
        env:
          HF_ENDPOINT_INPUT: ${{ inputs.hf_endpoint }}
        run: |
          $arguments = @(
            "scripts/model-runtime/prepare_assets.py",
            "--cache-root", "artifacts/build-cache/windows-x64",
            "--all"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:HF_ENDPOINT_INPUT)) {
            $arguments += @("--hf-endpoint", $env:HF_ENDPOINT_INPUT)
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned GGUF component preparation failed."
          }
          python scripts/model-runtime/validate_assets.py `
            --asset-root artifacts/build-cache/windows-x64 `
            --component-lock artifacts/build-cache/windows-x64/components.lock.json
          if ($LASTEXITCODE -ne 0) {
            throw "Prepared component cache validation failed."
          }

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup `
            --version=6.7.1 `
            --allow-downgrade `
            --force `
            --no-progress `
            --yes
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Inno Setup installation failed."
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned ISCC.exe was not installed at the expected path."
          }

      - name: Build and smoke-test the complete offline installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ./scripts/build_windows_gguf_installer.ps1 `
            -CacheRoot artifacts/build-cache/windows-x64 `
            -OutputRoot artifacts/installer `
            -PythonExe python `
            -Version $env:PACKAGE_VERSION `
            -IsccPath $iscc `
            -RequireSetupExe
          if ($LASTEXITCODE -ne 0) {
            throw "Full GGUF installer build or smoke test failed."
          }

      - name: Verify release artifact set and checksums
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $root = Resolve-Path artifacts/installer
          $required = @(
            "debug-platform-offline-gguf-$env:PACKAGE_VERSION-windows-x64.zip",
            "debug-platform-offline-gguf-$env:PACKAGE_VERSION-windows-x64.zip.sha256",
            "GWAP-Debug-Platform-Setup-$env:PACKAGE_VERSION-x64.exe",
            "GWAP-Debug-Platform-Setup-$env:PACKAGE_VERSION-x64.exe.sha256",
            "debug-platform-offline-gguf-$env:PACKAGE_VERSION-windows-x64.provenance.json",
            "debug-platform-offline-gguf-$env:PACKAGE_VERSION-windows-x64.provenance.json.sha256"
          )
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release artifact is missing: $name"
            }
          }
          foreach ($payload in $required | Where-Object { -not $_.EndsWith('.sha256') }) {
            $expected = ((Get-Content -LiteralPath (Join-Path $root "$payload.sha256") -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath (Join-Path $root $payload) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) {
              throw "Release artifact checksum mismatch: $payload"
            }
          }

      - name: Upload the verified full-GGUF release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-platform-full-gguf-${{ steps.release-version.outputs.version }}-windows-x64
          path: |
            artifacts/installer/debug-platform-offline-gguf-*-windows-x64.zip
            artifacts/installer/debug-platform-offline-gguf-*-windows-x64.zip.sha256
            artifacts/installer/GWAP-Debug-Platform-Setup-*-x64.exe
            artifacts/installer/GWAP-Debug-Platform-Setup-*-x64.exe.sha256
            artifacts/installer/debug-platform-offline-gguf-*-windows-x64.provenance.json
            artifacts/installer/debug-platform-offline-gguf-*-windows-x64.provenance.json.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release-assets:
    name: Attach verified installers to the published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: debug-platform-full-gguf-${{ needs.build.outputs.version }}-windows-x64
          path: artifacts/installer

      - name: Attach the immutable artifacts to this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts/installer -maxdepth 1 -type f -print | sort)
          if [[ ${#files[@]} -ne 6 ]]; then
            echo "Expected exactly six release files, found ${#files[@]}." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
