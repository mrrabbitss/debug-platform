name: Skill-only validation

on:
  push:
    branches: [skillonly]
  pull_request:
    branches: [skillonly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Runtime source mapping
        run: python -B scripts/check_source_mapping.py --source-repo .

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        if: matrix.os != 'windows-latest' || matrix.python != '3.14'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Python with bootstrap cache
        if: matrix.os == 'windows-latest' && matrix.python == '3.14'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            runtime/backend/constraints.lock
            runtime/backend/pyproject.toml
      - name: Unit tests
        run: python -B -m unittest discover -s tests -q
      - name: Runtime provenance
        run: python -B scripts/check_provenance.py
      - name: Release envelope
        run: python -B scripts/validate_release.py
      - name: Deterministic smoke contract
        run: python -B scripts/ci_deterministic_smoke.py --check-only
      - name: Cross-platform launcher
        if: runner.os != 'Windows'
        shell: bash
        env:
          GW_AP_DEBUG_PYTHON: python
        run: bash scripts/gw_ap_debug.sh doctor --check package
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\gw_ap_debug.ps1 -Python python doctor --check package
      - name: Windows installer registration
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testHome = "${{ runner.temp }}\gw-ap-debug-registration"
          .\scripts\setup_user_skill.ps1 -Clients All -HomeRoot $testHome -Python python
          .\scripts\setup_user_skill.ps1 -Clients All -HomeRoot $testHome -Python python
          $targets = @(
            "$testHome\.agents\skills\gw-ap-debug",
            "$testHome\.claude\skills\gw-ap-debug",
            "$testHome\.config\opencode\skills\gw-ap-debug"
          )
          foreach ($target in $targets) {
            $item = Get-Item -LiteralPath $target -Force
            if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Expected a junction: $target"
            }
          }
      - name: Windows Python 3.14 deterministic bootstrap smoke
        if: matrix.os == 'windows-latest' && matrix.python == '3.14'
        shell: powershell
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
          PIP_PROGRESS_BAR: "off"
          PYTHONUTF8: "1"
        run: python -B scripts/ci_deterministic_smoke.py
      - name: POSIX installer registration
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/gw-ap-debug-registration"
          bash scripts/setup_user_skill.sh --clients all --home-root "$test_home" --python python
          bash scripts/setup_user_skill.sh --clients all --home-root "$test_home" --python python
          test -L "$test_home/.agents/skills/gw-ap-debug"
          test -L "$test_home/.claude/skills/gw-ap-debug"
          test -L "$test_home/.config/opencode/skills/gw-ap-debug"
