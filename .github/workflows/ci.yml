name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      APP_ENV: test
      AUTH_MODE: local
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.lock
      - run: python -m pip install --upgrade --constraint backend/constraints.lock pip
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - run: python -m ruff check backend/app backend/tests scripts
      - run: python -m compileall -q backend/app backend/tests scripts
      - run: python scripts/check_repo_harness.py
      - run: python scripts/check_architecture.py
      - name: Run backend regression and coverage gate
        run: >-
          python scripts/run_backend_tests.py
          --coverage-xml backend/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ runner.os }}
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  golden-quality:
    name: Golden Dataset Quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_MODE: local
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.lock
      - run: python -m pip install --upgrade --constraint backend/constraints.lock pip
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - name: Run blocking golden quality gates
        run: >-
          python scripts/run_golden_evals.py
          --output artifacts/validation/golden-ci.json
          --junit artifacts/validation/golden-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-quality-report
          path: artifacts/validation/golden-ci.*
          if-no-files-found: error

  browser-e2e:
    name: Browser E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade --constraint backend/constraints.lock pip
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium
        working-directory: frontend
      - name: Run isolated browser E2E
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ runner.os }}
          path: artifacts/e2e
          if-no-files-found: error

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock
            backend/constraints.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install --upgrade --constraint backend/constraints.lock pip
      - run: python -m pip install "uv==0.12.1"
      - name: Verify Python lock files
        shell: bash
        run: |
          uv lock --project backend --check
          uv export --project backend --locked --all-extras --no-emit-project --no-hashes --no-header --quiet --format requirements.txt --output-file /tmp/backend-constraints.lock
          diff --unified backend/constraints.lock /tmp/backend-constraints.lock
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - run: python -m pip_audit
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: vscode-extension

  external-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_USER: gwap
          POSTGRES_PASSWORD: gwap
          POSTGRES_DB: gwap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwap -d gwap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333
    env:
      APP_ENV: test
      AUTH_MODE: local
      LLM_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://gwap:gwap@127.0.0.1:5432/gwap
      QDRANT_URL: http://127.0.0.1:6333
      RUN_EXTERNAL_SERVICE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.lock
      - run: python -m pip install --upgrade --constraint backend/constraints.lock pip
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - name: Wait for Qdrant readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:6333/readyz", timeout=2).read()
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY
      - run: python -m pytest -q tests/test_external_services.py
        working-directory: backend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker build --tag gw-ap-debug-backend:ci backend
      - run: docker build --tag gw-ap-debug-frontend:ci frontend

  windows-runtime-smoke:
    runs-on: windows-latest
    env:
      APP_ENV: test
      AUTH_MODE: local
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --upgrade --constraint backend\constraints.lock pip
      - run: .\.venv\Scripts\python.exe -m pip install --constraint backend\constraints.lock -e ".\backend[dev]"
      - run: npm ci
        working-directory: frontend
      - name: Run isolated backend/frontend smoke test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\runtime_smoke.ps1
